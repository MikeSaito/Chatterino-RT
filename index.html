<!doctype html>
<html lang="ru">
  <head>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta charset="utf-8" />
    <title>WebTV_chats</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <form id="join-form">
          <label for="channel-input">канал</label>
          <input id="channel-input" name="channel" maxlength="25" autocomplete="off" spellcheck="false" />
          <button type="submit">Join</button>
        </form>
        <p id="status"></p>
      </header>
      <div id="stage">
        <div id="player-slot"></div>
        <div id="chat-pane">
          <canvas id="chat-canvas"></canvas>
        </div>
      </div>
    </div>
  </body>
</html>
