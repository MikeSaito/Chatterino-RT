<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta charset="utf-8" />
    <title>Chatterino RT</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app" data-ui-layout="extended">
      <aside id="sidebar">
        <p id="brand">Chatterino RT</p>
        <form id="join-form">
          <label for="channel-input" data-i18n="sidebar.join.label">channel</label>
          <input id="channel-input" name="channel" maxlength="25" autocomplete="off" spellcheck="false" />
          <button type="submit" class="btn btn-primary" data-i18n="sidebar.join.submit">Join</button>
        </form>
        <button type="button" id="join-toggle" class="btn-icon" hidden data-i18n-title="sidebar.join.toggle" data-i18n-aria-label="sidebar.join.toggle" title="Join channel" aria-label="Join channel" aria-haspopup="dialog" aria-expanded="false" aria-controls="join-popover"></button>
        <div id="channel-list-host" class="channel-list-host">
          <ul id="channel-list" role="tablist" data-i18n-aria-label="sidebar.channels.aria" aria-label="Channels"></ul>
        </div>
        <div id="auth-box">
          <button type="button" id="auth-chip" class="auth-chip" hidden aria-haspopup="menu" aria-expanded="false" aria-controls="auth-menu">
            <img id="auth-chip-avatar" class="auth-chip-avatar" alt="" width="20" height="20" hidden />
            <span id="auth-chip-letter" class="auth-chip-avatar is-placeholder" hidden aria-hidden="true"></span>
            <span id="auth-chip-login" class="auth-chip-login"></span>
          </button>
          <p id="auth-login"></p>
          <button type="button" id="auth-signin" class="btn btn-primary" data-i18n="auth.signin">Log in</button>
          <button type="button" id="settings-open" class="btn-icon" data-i18n-title="settings.open" data-i18n-aria-label="settings.open" title="Settings" aria-label="Settings"></button>
          <button type="button" id="auth-logout" class="btn" hidden>Log out</button>
          <p id="auth-device" hidden></p>
          <label class="sr-only" for="auth-paste" data-i18n="auth.paste.label">Chatterino login code</label>
          <textarea id="auth-paste" hidden rows="3" spellcheck="false" autocomplete="off"></textarea>
          <button type="button" id="auth-import" class="btn" hidden data-i18n="auth.import">Paste code</button>
        </div>
      </aside>
      <div id="main">
        <header id="header">
          <span id="header-channel-avatar" class="header-avatar" hidden>
            <img id="header-channel-avatar-img" class="header-avatar-img" alt="" width="28" height="28" hidden />
            <span id="header-channel-avatar-letter" class="header-avatar-letter" hidden aria-hidden="true"></span>
          </span>
          <span id="header-channel-name"></span>
          <span id="header-live" hidden data-i18n="header.live" data-i18n-title="header.live.title" title="Live">LIVE</span>
          <p id="channel-title" class="header-meta"></p>
          <button type="button" id="moderation-mode-btn" class="btn-ghost" data-i18n="header.mod" data-i18n-title="header.mod.title" title="Moderation mode" aria-pressed="false">Mod</button>
          <span id="streamer-badge" hidden data-i18n="header.streamer" data-i18n-title="header.streamer.title" title="Streamer Mode">Streamer Mode</span>
          <p id="status" class="status-line">
            <span id="status-spinner" class="status-spinner" hidden aria-hidden="true"></span>
            <span id="status-text"></span>
          </p>
          <button type="button" id="header-more" class="btn-icon" data-i18n-title="header.more" data-i18n-aria-label="header.more" title="More" aria-label="More" aria-haspopup="menu" aria-expanded="false" aria-controls="header-menu"></button>
          <div id="stream-tooltip" class="ui-tooltip" hidden>
            <img id="stream-tooltip-img" alt="" />
            <span id="stream-tooltip-text"></span>
          </div>
        </header>
        <div id="stage">
          <div id="player-slot"></div>
          <div
            id="stage-split"
            role="separator"
            aria-orientation="vertical"
            data-i18n-aria-label="header.split.aria"
            aria-label="Player size"
            tabindex="0"
          ></div>
          <div id="chat-column">
            <div id="chat-pane">
              <div id="chat-canvas-host">
                <canvas id="chat-canvas"></canvas>
                <div id="emote-tooltip" class="ui-tooltip" hidden>
                  <img id="emote-tooltip-img" alt="" />
                  <span id="emote-tooltip-text"></span>
                </div>
                <div id="chat-quick-actions" hidden>
                  <button type="button" id="chat-qa-reply" class="btn-icon" data-i18n-title="chat.qa.reply" data-i18n-aria-label="chat.qa.reply" title="Reply" aria-label="Reply"></button>
                  <button type="button" id="chat-qa-copy" class="btn-icon" data-i18n-title="chat.qa.copy" data-i18n-aria-label="chat.qa.copy" title="Copy" aria-label="Copy"></button>
                  <button type="button" id="chat-qa-more" class="btn-icon" data-i18n-title="chat.qa.more" data-i18n-aria-label="chat.qa.more" title="More" aria-label="More"></button>
                </div>
                <div id="chat-empty" hidden>
                  <div class="chat-empty-inner">
                    <span class="chat-empty-icon" aria-hidden="true"></span>
                    <p class="chat-empty-title">Select a channel</p>
                    <p class="chat-empty-hint">Join a channel to see messages</p>
                  </div>
                </div>
                <button id="chat-jump-bottom" type="button" class="btn-icon" hidden data-i18n-title="chat.jumpBottom" data-i18n-aria-label="chat.jumpBottom" title="Bottom" aria-label="Bottom">
                  <span id="chat-jump-badge" hidden></span>
                </button>
              </div>
              <div
                id="chat-scroll"
                role="scrollbar"
                aria-orientation="vertical"
                aria-controls="chat-canvas"
                aria-valuemin="0"
                aria-valuemax="0"
                aria-valuenow="0"
                tabindex="0"
              >
                <div id="chat-scroll-marks" aria-hidden="true"></div>
                <div id="chat-scroll-thumb"></div>
              </div>
            </div>
            <ul id="complete-list" hidden></ul>
            <div id="reply-bar" hidden>
              <p id="reply-label"></p>
              <button type="button" id="reply-cancel" class="btn-icon" data-i18n-title="reply.cancel" data-i18n-aria-label="reply.cancel" title="Cancel" aria-label="Cancel"></button>
            </div>
            <form id="composer">
              <label class="sr-only" for="composer-input" data-i18n="composer.label">message</label>
              <div id="composer-inner">
                <p id="composer-drop-hint" class="composer-drop-hint" hidden aria-hidden="true" data-i18n="composer.dropHint">
                  Drop an image here
                </p>
                <button type="button" id="emote-open" class="btn-icon" data-i18n-title="composer.emotes" data-i18n-aria-label="composer.emotes" title="Emotes" aria-label="Emotes"></button>
                <div id="composer-field">
                  <textarea
                    id="composer-input"
                    name="message"
                    rows="1"
                    maxlength="500"
                    spellcheck="false"
                  ></textarea>
                  <div id="composer-meta">
                    <span id="composer-wait" class="composer-wait-chip" hidden aria-live="polite">
                      <span class="composer-wait-icon" aria-hidden="true"></span>
                      <span class="composer-wait-text"></span>
                    </span>
                    <span id="composer-length" hidden aria-live="polite">0</span>
                  </div>
                </div>
                <button
                  id="composer-send"
                  class="btn-icon btn-primary"
                  type="submit"
                  disabled
                  data-i18n-aria-label="composer.send.aria"
                  title="Twitch login required to send messages"
                  aria-label="Send"
                ></button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <menu id="header-menu" hidden role="menu" data-i18n-aria-label="header.menu.aria" aria-label="More"></menu>
    <menu id="auth-menu" hidden role="menu" data-i18n-aria-label="auth.menu.aria" aria-label="Account"></menu>
    <div id="join-popover" hidden role="dialog" data-i18n-aria-label="joinPopover.aria" aria-label="Join channel">
      <form id="join-popover-form">
        <label class="sr-only" for="join-popover-input" data-i18n="joinPopover.label">channel</label>
        <input id="join-popover-input" name="channel" maxlength="25" autocomplete="off" spellcheck="false" />
        <button type="submit" class="btn btn-primary" data-i18n="joinPopover.submit">Join</button>
      </form>
    </div>
    <menu id="chat-context" hidden role="menu" data-i18n-aria-label="context.aria" aria-label="Message">
      <div id="chat-context-custom" class="chat-context-custom" hidden></div>
      <hr id="chat-context-custom-sep" hidden />
      <div id="chat-context-image-open" class="chat-context-submenu" hidden>
        <button type="button" class="chat-context-submenu-label" tabindex="-1">Open</button>
        <div class="chat-context-submenu-items"></div>
      </div>
      <div id="chat-context-image-copy" class="chat-context-submenu" hidden>
        <button type="button" class="chat-context-submenu-label" tabindex="-1">Copy</button>
        <div class="chat-context-submenu-items"></div>
      </div>
      <hr id="chat-context-image-sep" hidden />
      <button type="button" role="menuitem" data-action="copy">Copy message</button>
      <button type="button" role="menuitem" data-action="copy-full">Copy full message</button>
      <button type="button" role="menuitem" data-action="copy-id" hidden>Copy message ID</button>
      <button type="button" role="menuitem" data-action="copy-json" hidden>Copy message JSON</button>
      <button type="button" role="menuitem" data-action="open-link">Open link</button>
      <button type="button" role="menuitem" data-action="open-link-incognito">Open link incognito</button>
      <button type="button" role="menuitem" data-action="copy-link">Copy link</button>
      <button type="button" role="menuitem" data-action="web-search" hidden>Search</button>
      <button type="button" role="menuitem" data-action="reply">Reply</button>
      <button type="button" role="menuitem" data-action="reply-original" hidden>Reply to original thread</button>
      <button type="button" role="menuitem" data-action="thread">View thread</button>
      <button type="button" role="menuitem" data-action="user">User card</button>
      <button type="button" role="menuitem" data-action="open-twitch">Open in browser</button>
      <button type="button" role="menuitem" data-action="open-streamlink">Open in Streamlink</button>
      <button type="button" role="menuitem" data-action="open-custom-player">Open in custom player</button>
    </menu>
    <div id="usercard-modal" hidden>
      <div
        id="usercard-dialog"
        role="dialog"
        aria-modal="false"
        aria-labelledby="usercard-name"
      >
        <div id="usercard-skeleton" class="usercard-skeleton" hidden aria-hidden="true">
          <div class="usercard-skeleton-avatar"></div>
          <div class="usercard-skeleton-lines">
            <span></span>
            <span></span>
          </div>
        </div>
        <header class="popup-head">
          <img id="usercard-avatar" alt="" hidden width="64" height="64" />
          <div>
            <h2 id="usercard-name">User</h2>
            <p id="usercard-login" class="popup-sub"></p>
            <p id="usercard-pronouns" class="popup-sub usercard-pronouns" hidden></p>
          </div>
          <div class="popup-head-actions">
            <button type="button" id="usercard-pin" class="btn-icon" data-i18n-title="usercard.pin" data-i18n-aria-label="usercard.pin" title="Pin" aria-label="Pin"></button>
            <button type="button" id="usercard-close" class="btn-icon" data-i18n-title="usercard.close" data-i18n-aria-label="usercard.close" title="Close" aria-label="Close"></button>
          </div>
        </header>
        <div id="usercard-meta" class="usercard-meta">
          <p id="usercard-localized" class="usercard-meta-row" hidden>
            <span id="usercard-localized-text"></span>
            <button type="button" id="usercard-copy-localized" data-i18n="usercard.copyLocalized" data-i18n-title="usercard.copyLocalized.title" title="Copy localized name">Copy</button>
          </p>
          <p id="usercard-userid" class="usercard-meta-row usercard-meta-muted" hidden>
            <span id="usercard-userid-text"></span>
            <button type="button" id="usercard-copy-id" data-i18n="usercard.copyId" data-i18n-title="usercard.copyId.title" title="Copy ID">Copy ID</button>
          </p>
          <p id="usercard-followers" class="usercard-meta-row" hidden></p>
          <p id="usercard-created" class="usercard-meta-row" hidden></p>
          <p id="usercard-followage" class="usercard-meta-row" hidden></p>
          <p id="usercard-subage" class="usercard-meta-row" hidden></p>
        </div>
        <label id="usercard-block-row" class="usercard-block-row" hidden>
          <input type="checkbox" id="usercard-block" />
          <span data-i18n="usercard.block">Block</span>
        </label>
        <label id="usercard-ignore-highlights-row" class="usercard-ignore-highlights-row" hidden>
          <input type="checkbox" id="usercard-ignore-highlights" />
          <span data-i18n="usercard.ignoreHighlights">Ignore highlights</span>
        </label>
        <p id="usercard-notes-preview" class="usercard-notes-preview" hidden></p>
        <div class="popup-actions">
          <button type="button" id="usercard-add-notes" class="btn btn-primary" disabled data-i18n="usercard.addNotes">Add notes</button>
          <button type="button" id="usercard-open-twitch" class="btn btn-primary" data-i18n="usercard.openTwitch">Open on Twitch</button>
        </div>
        <div id="usercard-mod-row" class="usercard-mod-row" hidden>
          <div id="usercard-roles" class="usercard-roles" hidden>
            <button type="button" id="usercard-mod" data-i18n="usercard.mod" data-i18n-title="usercard.mod" title="Mod">Mod</button>
            <button type="button" id="usercard-unmod" data-i18n="usercard.unmod" data-i18n-title="usercard.unmod" title="Unmod">Unmod</button>
            <button type="button" id="usercard-vip" data-i18n="usercard.vip" data-i18n-title="usercard.vip" title="VIP">VIP</button>
            <button type="button" id="usercard-unvip" data-i18n="usercard.unvip" data-i18n-title="usercard.unvip" title="UnVIP">UnVIP</button>
          </div>
          <button type="button" id="usercard-unban" data-i18n="usercard.unban" data-i18n-title="usercard.unban" title="Unban" hidden>Unban</button>
          <div id="usercard-timeouts" class="usercard-timeouts" data-i18n-aria-label="usercard.timeouts.aria" aria-label="Timeout durations"></div>
          <button type="button" id="usercard-ban" class="is-danger" data-i18n="usercard.ban" data-i18n-title="usercard.ban" title="Ban" hidden>Ban</button>
        </div>
        <p id="usercard-status" class="usercard-status" hidden></p>
        <div id="usercard-recent" data-i18n-aria-label="usercard.recent.aria" aria-label="Recent messages"></div>
      </div>
    </div>
    <div id="notes-modal" hidden>
      <div id="notes-backdrop"></div>
      <div
        id="notes-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="notes-title"
      >
        <header class="popup-head">
          <h2 id="notes-title">Editing notes</h2>
          <button type="button" id="notes-close" class="btn-icon" data-i18n-title="notes.close" data-i18n-aria-label="notes.close" title="Close" aria-label="Close"></button>
        </header>
        <textarea
          id="notes-editor"
          rows="12"
          spellcheck="true"
          autocomplete="off"
        ></textarea>
        <footer class="popup-foot notes-foot">
          <span id="notes-counter" class="notes-counter">0</span>
          <div class="notes-foot-actions">
            <button type="button" id="notes-ok" class="btn btn-primary" data-i18n="notes.ok">Ok</button>
            <button type="button" id="notes-cancel" class="btn" data-i18n="notes.cancel">Cancel</button>
          </div>
        </footer>
      </div>
    </div>
    <div id="replythread-modal" hidden>
      <div id="replythread-backdrop"></div>
      <div id="replythread-dialog" role="dialog" aria-modal="true" aria-labelledby="replythread-title">
        <header class="popup-head replythread-head">
          <span id="replythread-avatar" class="replythread-avatar" aria-hidden="true"></span>
          <div class="replythread-head-text">
            <h2 id="replythread-title">Thread</h2>
            <p id="replythread-sub" class="popup-sub"></p>
          </div>
          <div class="popup-head-actions">
            <button type="button" id="replythread-pin" class="btn-icon" data-i18n-title="thread.pin" data-i18n-aria-label="thread.pin" title="Pin" aria-label="Pin" hidden></button>
            <button type="button" id="replythread-close" class="btn-icon" data-i18n-title="thread.close" data-i18n-aria-label="thread.close" title="Close" aria-label="Close"></button>
          </div>
        </header>
        <div id="replythread-view"></div>
        <footer class="popup-foot replythread-foot">
          <textarea id="replythread-input" rows="2" spellcheck="false" autocomplete="off" placeholder="Reply..."></textarea>
          <button type="button" id="replythread-send" class="btn btn-primary" data-i18n="thread.send">Send</button>
        </footer>
      </div>
    </div>
    <div id="emotepopup-modal" hidden>
      <div id="emotepopup-backdrop"></div>
      <div id="emotepopup-dialog" role="dialog" aria-modal="false" aria-labelledby="emotepopup-title">
        <header class="popup-head">
          <h2 id="emotepopup-title">Emotes</h2>
          <button type="button" id="emotepopup-close" class="btn-icon" data-i18n-title="emotes.close" data-i18n-aria-label="emotes.close" title="Close" aria-label="Close"></button>
        </header>
        <div class="emotepopup-tabs" role="tablist">
          <button type="button" class="emotepopup-tab" data-tab="favourite" role="tab" aria-selected="false" data-i18n="emotes.tab.favourite">Favourite</button>
          <button type="button" class="emotepopup-tab is-active" data-tab="subs" role="tab" aria-selected="true" data-i18n="emotes.tab.subs">Subs</button>
          <button type="button" class="emotepopup-tab" data-tab="channel" role="tab" aria-selected="false" data-i18n="emotes.tab.channel">Channel</button>
          <button type="button" class="emotepopup-tab" data-tab="global" role="tab" aria-selected="false" data-i18n="emotes.tab.global">Global</button>
          <button type="button" class="emotepopup-tab" data-tab="emojis" role="tab" aria-selected="false" data-i18n="emotes.tab.emojis">Emojis</button>
        </div>
        <input id="emotepopup-search" type="search" data-i18n-placeholder="emotes.search.placeholder" placeholder="Search emotes" autocomplete="off" spellcheck="false" />
        <div id="emotepopup-view" role="tabpanel"></div>
      </div>
    </div>
    <div id="search-modal" hidden>
      <div id="search-backdrop"></div>
      <div
        id="search-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="search-title"
      >
        <header id="search-dialog-head">
          <h2 id="search-title">Searching in history</h2>
          <button type="button" id="search-close" class="btn-icon" data-i18n-title="find.close" data-i18n-aria-label="find.close" title="Close" aria-label="Close"></button>
        </header>
        <div id="search-input-row">
          <label class="sr-only" for="search-input" data-i18n="find.label">Type to search</label>
          <input
            id="search-input"
            type="text"
            data-i18n-placeholder="find.placeholder"
            placeholder="Type to search"
            autocomplete="off"
            spellcheck="false"
          />
          <button
            type="button"
            id="search-clear"
            class="btn-icon"
            data-i18n-title="find.clear"
            hidden
            data-i18n-aria-label="find.clear.aria"
            title="Clear"
            aria-label="Clear search"
          ></button>
        </div>
        <div id="search-view" role="list" data-i18n-aria-label="find.results.aria" aria-label="Search results"></div>
      </div>
    </div>
    </div>
    <div id="toast-host" role="region" data-i18n-aria-label="toast.host.aria" aria-label="Notifications"></div>
  </body>
</html>
