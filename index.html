<!doctype html>
<html lang="ru">
  <head>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta charset="utf-8" />
    <title>Chatterino RT</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <p id="brand">Chatterino RT</p>
        <form id="join-form">
          <label for="channel-input">канал</label>
          <input id="channel-input" name="channel" maxlength="25" autocomplete="off" spellcheck="false" />
          <button type="submit">Join</button>
        </form>
        <ul id="channel-list"></ul>
        <details id="filters-box">
          <summary>Фильтры</summary>
          <form id="filters-form">
            <label class="filters-check">
              <input type="checkbox" id="filters-self" checked />
              свой ник
            </label>
            <label for="filters-ignore-logins">игнор логинов</label>
            <textarea id="filters-ignore-logins" rows="3" spellcheck="false" autocomplete="off"></textarea>
            <label for="filters-ignore-phrases">игнор фраз</label>
            <textarea id="filters-ignore-phrases" rows="3" spellcheck="false" autocomplete="off"></textarea>
            <label for="filters-highlight-phrases">хайлайт фраз</label>
            <textarea id="filters-highlight-phrases" rows="3" spellcheck="false" autocomplete="off"></textarea>
            <label for="filters-highlight-logins">хайлайт логинов</label>
            <textarea id="filters-highlight-logins" rows="3" spellcheck="false" autocomplete="off"></textarea>
            <button type="submit">Сохранить</button>
            <p id="filters-status"></p>
          </form>
        </details>
        <div id="auth-box">
          <p id="auth-login"></p>
          <button type="button" id="auth-signin">Войти</button>
          <button type="button" id="auth-logout" hidden>Выйти</button>
          <p id="auth-device" hidden></p>
          <label class="sr-only" for="auth-paste">код входа Chatterino</label>
          <textarea id="auth-paste" hidden rows="3" spellcheck="false" autocomplete="off"></textarea>
          <button type="button" id="auth-import" hidden>Вставить код</button>
        </div>
      </aside>
      <div id="main">
        <header id="header">
          <p id="channel-title"></p>
          <p id="status"></p>
        </header>
        <div id="stage">
          <div id="player-slot"></div>
          <div id="chat-column">
            <div id="chat-pane">
              <div id="chat-canvas-host">
                <canvas id="chat-canvas"></canvas>
                <button id="chat-jump-bottom" type="button" hidden>вниз</button>
              </div>
              <div
                id="chat-scroll"
                role="scrollbar"
                aria-orientation="vertical"
                aria-controls="chat-canvas"
                aria-valuemin="0"
                aria-valuemax="0"
                aria-valuenow="0"
                tabindex="0"
              >
                <div id="chat-scroll-thumb"></div>
              </div>
            </div>
            <ul id="complete-list" hidden></ul>
            <div id="reply-bar" hidden>
              <p id="reply-label"></p>
              <button type="button" id="reply-cancel" title="Отмена">×</button>
            </div>
            <form id="composer">
              <label class="sr-only" for="composer-input">сообщение</label>
              <textarea
                id="composer-input"
                name="message"
                rows="2"
                maxlength="500"
                spellcheck="false"
              ></textarea>
              <button
                id="composer-send"
                type="submit"
                disabled
                title="Нужен вход Twitch, чтобы отправлять сообщения"
              >
                Send
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <menu id="chat-context" hidden>
      <button type="button" data-action="copy">Копировать</button>
      <button type="button" data-action="reply">Ответить</button>
      <button type="button" data-action="user">Открыть профиль</button>
    </menu>
  </body>
</html>
