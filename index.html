<!doctype html>
<html lang="ru">
  <head>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta charset="utf-8" />
    <title>Chatterino RT</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app" data-ui-layout="extended">
      <aside id="sidebar">
        <p id="brand">Chatterino RT</p>
        <form id="join-form">
          <label for="channel-input">канал</label>
          <input id="channel-input" name="channel" maxlength="25" autocomplete="off" spellcheck="false" />
          <button type="submit">Join</button>
        </form>
        <ul id="channel-list" role="list"></ul>
        <div id="auth-box">
          <p id="auth-login"></p>
          <button type="button" id="auth-signin">Войти</button>
          <button type="button" id="auth-logout" hidden>Выйти</button>
          <p id="auth-device" hidden></p>
          <label class="sr-only" for="auth-paste">код входа Chatterino</label>
          <textarea id="auth-paste" hidden rows="3" spellcheck="false" autocomplete="off"></textarea>
          <button type="button" id="auth-import" hidden>Вставить код</button>
        </div>
      </aside>
      <div id="main">
        <header id="header">
          <p id="channel-title"></p>
          <button type="button" id="moderation-mode-btn" title="Moderation mode" aria-pressed="false">Mod</button>
          <span id="streamer-badge" hidden title="Streamer Mode">Streamer Mode</span>
          <p id="status"></p>
          <button type="button" id="settings-open">Настройки</button>
          <div id="stream-tooltip" hidden>
            <img id="stream-tooltip-img" alt="" />
            <span id="stream-tooltip-text"></span>
          </div>
        </header>
        <div id="stage">
          <div id="player-slot"></div>
          <div id="chat-column">
            <div id="chat-pane">
              <div id="chat-canvas-host">
                <canvas id="chat-canvas"></canvas>
                <div id="emote-tooltip" hidden>
                  <img id="emote-tooltip-img" alt="" />
                  <span id="emote-tooltip-text"></span>
                </div>
                <button type="button" id="chat-reply-btn" hidden title="Reply">Reply</button>
                <button id="chat-jump-bottom" type="button" hidden>вниз</button>
              </div>
              <div
                id="chat-scroll"
                role="scrollbar"
                aria-orientation="vertical"
                aria-controls="chat-canvas"
                aria-valuemin="0"
                aria-valuemax="0"
                aria-valuenow="0"
                tabindex="0"
              >
                <div id="chat-scroll-marks" aria-hidden="true"></div>
                <div id="chat-scroll-thumb"></div>
              </div>
            </div>
            <ul id="complete-list" hidden></ul>
            <div id="reply-bar" hidden>
              <p id="reply-label"></p>
              <button type="button" id="reply-cancel" title="Отмена">×</button>
            </div>
            <form id="composer">
              <label class="sr-only" for="composer-input">сообщение</label>
              <button type="button" id="emote-open" title="Emotes">☺</button>
              <div id="composer-field">
                <textarea
                  id="composer-input"
                  name="message"
                  rows="2"
                  maxlength="500"
                  spellcheck="false"
                ></textarea>
                <div id="composer-meta">
                  <span id="composer-wait" hidden aria-live="polite"></span>
                  <span id="composer-length" hidden aria-live="polite">0</span>
                </div>
              </div>
              <button
                id="composer-send"
                type="submit"
                hidden
                disabled
                title="Нужен вход Twitch, чтобы отправлять сообщения"
              >
                Send
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <menu id="chat-context" hidden>
      <div id="chat-context-custom" class="chat-context-custom" hidden></div>
      <hr id="chat-context-custom-sep" hidden />
      <div id="chat-context-image-open" class="chat-context-submenu" hidden>
        <button type="button" class="chat-context-submenu-label" tabindex="-1">Open</button>
        <div class="chat-context-submenu-items"></div>
      </div>
      <div id="chat-context-image-copy" class="chat-context-submenu" hidden>
        <button type="button" class="chat-context-submenu-label" tabindex="-1">Copy</button>
        <div class="chat-context-submenu-items"></div>
      </div>
      <hr id="chat-context-image-sep" hidden />
      <button type="button" data-action="copy">Copy message</button>
      <button type="button" data-action="copy-full">Copy full message</button>
      <button type="button" data-action="copy-id" hidden>Copy message ID</button>
      <button type="button" data-action="copy-json" hidden>Copy message JSON</button>
      <button type="button" data-action="open-link">Open link</button>
      <button type="button" data-action="open-link-incognito">Open link incognito</button>
      <button type="button" data-action="copy-link">Copy link</button>
      <button type="button" data-action="web-search" hidden>Search</button>
      <button type="button" data-action="reply">Reply</button>
      <button type="button" data-action="reply-original" hidden>Reply to original thread</button>
      <button type="button" data-action="thread">View thread</button>
      <button type="button" data-action="user">User card</button>
      <button type="button" data-action="open-twitch">Open in browser</button>
      <button type="button" data-action="open-streamlink">Open in Streamlink</button>
      <button type="button" data-action="open-custom-player">Open in custom player</button>
    </menu>
    <div id="usercard-modal" hidden>
      <div
        id="usercard-dialog"
        role="dialog"
        aria-modal="false"
        aria-labelledby="usercard-name"
      >
        <header class="popup-head">
          <img id="usercard-avatar" alt="" hidden width="64" height="64" />
          <div>
            <h2 id="usercard-name">User</h2>
            <p id="usercard-login" class="popup-sub"></p>
            <p id="usercard-pronouns" class="popup-sub usercard-pronouns" hidden></p>
          </div>
          <div class="popup-head-actions">
            <button type="button" id="usercard-pin" title="Pin">Pin</button>
            <button type="button" id="usercard-close" title="Close">×</button>
          </div>
        </header>
        <div id="usercard-meta" class="usercard-meta">
          <p id="usercard-localized" class="usercard-meta-row" hidden>
            <span id="usercard-localized-text"></span>
            <button type="button" id="usercard-copy-localized" title="Copy localized name">Copy</button>
          </p>
          <p id="usercard-userid" class="usercard-meta-row usercard-meta-muted" hidden>
            <span id="usercard-userid-text"></span>
            <button type="button" id="usercard-copy-id" title="Copy ID">Copy ID</button>
          </p>
          <p id="usercard-followers" class="usercard-meta-row" hidden></p>
          <p id="usercard-created" class="usercard-meta-row" hidden></p>
          <p id="usercard-followage" class="usercard-meta-row" hidden></p>
          <p id="usercard-subage" class="usercard-meta-row" hidden></p>
        </div>
        <label id="usercard-block-row" class="usercard-block-row" hidden>
          <input type="checkbox" id="usercard-block" />
          Block
        </label>
        <label id="usercard-ignore-highlights-row" class="usercard-ignore-highlights-row" hidden>
          <input type="checkbox" id="usercard-ignore-highlights" />
          Ignore highlights
        </label>
        <p id="usercard-notes-preview" class="usercard-notes-preview" hidden></p>
        <div class="popup-actions">
          <button type="button" id="usercard-add-notes" disabled>Add notes</button>
          <button type="button" id="usercard-open-twitch">Open on Twitch</button>
        </div>
        <div id="usercard-mod-row" class="usercard-mod-row" hidden>
          <div id="usercard-roles" class="usercard-roles" hidden>
            <button type="button" id="usercard-mod" title="Mod">Mod</button>
            <button type="button" id="usercard-unmod" title="Unmod">Unmod</button>
            <button type="button" id="usercard-vip" title="VIP">VIP</button>
            <button type="button" id="usercard-unvip" title="UnVIP">UnVIP</button>
          </div>
          <button type="button" id="usercard-unban" title="Unban" hidden>Unban</button>
          <div id="usercard-timeouts" class="usercard-timeouts" aria-label="Timeout durations"></div>
          <button type="button" id="usercard-ban" title="Ban" hidden>Ban</button>
        </div>
        <p id="usercard-status" class="usercard-status" hidden></p>
        <div id="usercard-recent" aria-label="Recent messages"></div>
      </div>
    </div>
    <div id="notes-modal" hidden>
      <div id="notes-backdrop"></div>
      <div
        id="notes-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="notes-title"
      >
        <header class="popup-head">
          <h2 id="notes-title">Editing notes</h2>
          <button type="button" id="notes-close" title="Close">×</button>
        </header>
        <textarea
          id="notes-editor"
          rows="12"
          spellcheck="true"
          autocomplete="off"
        ></textarea>
        <footer class="popup-foot notes-foot">
          <button type="button" id="notes-ok">Ok</button>
          <button type="button" id="notes-cancel">Cancel</button>
        </footer>
      </div>
    </div>
    <div id="replythread-modal" hidden>
      <div id="replythread-backdrop"></div>
      <div id="replythread-dialog" role="dialog" aria-modal="true" aria-labelledby="replythread-title">
        <header class="popup-head">
          <h2 id="replythread-title">Thread</h2>
          <div class="popup-head-actions">
            <button type="button" id="replythread-pin" title="Pin" hidden>Pin</button>
            <button type="button" id="replythread-close" title="Close">×</button>
          </div>
        </header>
        <div id="replythread-view"></div>
        <footer class="popup-foot replythread-foot">
          <textarea id="replythread-input" rows="2" spellcheck="false" autocomplete="off" placeholder="Reply..."></textarea>
          <button type="button" id="replythread-send">Send</button>
        </footer>
      </div>
    </div>
    <div id="emotepopup-modal" hidden>
      <div id="emotepopup-backdrop"></div>
      <div id="emotepopup-dialog" role="dialog" aria-modal="true" aria-labelledby="emotepopup-title">
        <header class="popup-head">
          <h2 id="emotepopup-title">Emotes</h2>
          <button type="button" id="emotepopup-close" title="Close">×</button>
        </header>
        <div class="emotepopup-tabs" role="tablist">
          <button type="button" class="emotepopup-tab" data-tab="favourite" role="tab" aria-selected="false">Favourite</button>
          <button type="button" class="emotepopup-tab is-active" data-tab="subs" role="tab" aria-selected="true">Subs</button>
          <button type="button" class="emotepopup-tab" data-tab="channel" role="tab" aria-selected="false">Channel</button>
          <button type="button" class="emotepopup-tab" data-tab="global" role="tab" aria-selected="false">Global</button>
          <button type="button" class="emotepopup-tab" data-tab="emojis" role="tab" aria-selected="false">Emojis</button>
        </div>
        <input id="emotepopup-search" type="search" placeholder="Search emotes" autocomplete="off" spellcheck="false" />
        <div id="emotepopup-view" role="tabpanel"></div>
      </div>
    </div>
    <div id="search-modal" hidden>
      <div id="search-backdrop"></div>
      <div
        id="search-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="search-title"
      >
        <header id="search-dialog-head">
          <h2 id="search-title">Поиск в истории</h2>
          <button type="button" id="search-close" title="Закрыть">×</button>
        </header>
        <div id="search-input-row">
          <label class="sr-only" for="search-input">Type to search</label>
          <input
            id="search-input"
            type="text"
            placeholder="Type to search"
            autocomplete="off"
            spellcheck="false"
          />
          <button
            type="button"
            id="search-clear"
            title="Clear"
            hidden
            aria-label="Clear search"
          >
            ×
          </button>
        </div>
        <div id="search-view" role="list" aria-label="Результаты поиска"></div>
      </div>
    </div>
    </div>
  </body>
</html>
