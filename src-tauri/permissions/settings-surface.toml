[[permission]]
identifier = "settings-surface"
description = "Settings window allowlist: config/auth/filters/cache/about — no chat send, subscribe, or mod Helix"
commands.allow = [
  "settings_get",
  "settings_set",
  "filters_get",
  "filters_set",
  "auth_start",
  "auth_status",
  "auth_import",
  "auth_select",
  "auth_remove",
  "cache_info",
  "cache_pick_directory",
  "cache_clear",
  "open_settings_directory",
  "open_chat_link",
  "about_info",
  "highlight_sound_pick",
  "highlight_sound_read",
  "logging_pick_directory",
  "chatterino1_commands_available",
  "read_chatterino1_commands",
  "supports_incognito_links",
  "chat_blocked_users"
]
