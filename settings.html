<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/logo-128.png" sizes="128x128" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/settings-window.css" />
    <meta charset="utf-8" />
    <title>Chatterino Settings</title>
    <script type="module" src="/src/settings.ts" defer></script>
  </head>
  <body class="settings-window-body">
    <div
      id="settings-root"
      role="dialog"
      aria-modal="false"
      aria-labelledby="settings-title"
    >
      <header id="settings-dialog-head">
        <div class="settings-brand">
          <img src="/logo-128.png" width="22" height="22" alt="" />
          <h2 id="settings-title" data-i18n="settings.title">Chatterino Settings</h2>
        </div>
        <div id="settings-search-wrap">
          <span id="settings-search-icon" class="settings-search-icon" aria-hidden="true"></span>
          <label class="sr-only" for="settings-search" data-i18n="settings.search.label">Find in settings</label>
          <input
            id="settings-search"
            type="search"
            data-i18n-placeholder="settings.search.placeholder"
            placeholder="Find in settings... (Ctrl+F)"
            autocomplete="off"
            spellcheck="false"
          />
          <button
            type="button"
            id="settings-search-clear"
            class="btn-icon"
            data-i18n-title="settings.search.clear"
            data-i18n-aria-label="settings.search.clear.aria"
            title="Clear"
            aria-label="Clear search"
            hidden
          ></button>
          <span id="settings-search-count" class="settings-search-count" hidden aria-live="polite"></span>
        </div>
      </header>
      <div id="settings-body">
        <nav id="settings-tabs" data-i18n-aria-label="settings.tabs.aria" aria-label="Settings pages"></nav>
        <div id="settings-pages"></div>
      </div>
      <footer id="settings-dialog-foot">
        <p id="settings-status"></p>
        <div id="settings-actions">
          <button type="button" id="settings-ok" class="btn btn-primary" data-i18n="settings.ok">Ok</button>
          <button type="button" id="settings-cancel" class="btn" data-i18n="settings.cancel">Cancel</button>
        </div>
      </footer>
      <template id="settings-preview-template">
        <aside class="settings-chat-preview" aria-labelledby="settings-preview-title">
          <h4 id="settings-preview-title" data-i18n="settings.preview.title">Chat preview</h4>
          <div class="settings-preview-card">
            <strong class="settings-preview-channel" data-i18n="settings.preview.channel">Evening stream</strong>
            <div class="settings-preview-messages">
              <div><time datetime="21:04">21:04</time> <b class="preview-nick-blue">Лена</b> <span data-i18n="settings.preview.first">Good evening! How is the sound?</span></div>
              <div><time datetime="21:05">21:05</time> <b class="preview-nick-green">Саша</b> <span data-i18n="settings.preview.second">Sounds great.</span></div>
              <div><time datetime="21:06">21:06</time> <b class="preview-nick-violet">Миша</b> <span data-i18n="settings.preview.third">Made it in time. What are we playing today?</span></div>
              <div><time datetime="21:07">21:07</time> <b class="preview-nick-blue">Лена</b> <span data-i18n="settings.preview.fourth">Let's pick up where we left off.</span></div>
            </div>
          </div>
          <p data-i18n="settings.preview.hint">See how your changes look in chat.</p>
        </aside>
      </template>
    </div>
  </body>
</html>
