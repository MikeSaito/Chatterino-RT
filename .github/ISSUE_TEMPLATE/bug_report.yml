name: Bug report
description: Something is broken or incorrect in Chatterino RT
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Fill in the sections below so the issue can be reproduced.
  - type: input
    id: version
    attributes:
      label: App version
      description: Release tag or `About` version (e.g. 1.1.0).
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: Windows edition and build if known.
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps starting from a clean launch when possible.
      placeholder: |
        1. Open the app
        2. Join channel …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant errors (redact tokens). Optional attachments via GitHub.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report does not contain OAuth tokens, passwords, or signing keys.
          required: true
